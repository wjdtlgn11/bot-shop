<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>디스코드 봇 & 소스코드 마켓</title>
    <style>
        body { background: #090d16; color: #ffffff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 40px 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid #1e293b; padding-bottom: 20px; }
        h1 { font-size: 24px; margin: 0; }
        p { color: #94a3b8; font-size: 14px; margin: 5px 0 0 0; }
        button { background: #1e293b; color: #fff; border: 1px solid #334155; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        button:hover { background: #334155; }
        .admin-panel { background: #111827; border: 1px solid #3b82f6; padding: 24px; border-radius: 12px; margin-bottom: 40px; display: none; }
        input, textarea { width: 100%; padding: 10px; background: #1f2937; border: 1px solid #374151; color: #fff; border-radius: 6px; box-sizing: border-box; margin-bottom: 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .card { background: #111827; border: 1px solid #1f2937; border-radius: 12px; padding: 20px; display: flex; flexDirection: column; justify-content: space-between; }
        .card h3 { margin: 0 0 10px 0; font-size: 18px; }
        .card p { color: #94a3b8; font-size: 13px; line-height: 1.4; margin: 0 0 15px 0; }
        .price { font-size: 18px; font-weight: bold; color: #38bdf8; margin-bottom: 15px; }
        .buy-btn { text-align: center; background: #5865F2; color: #fff; padding: 10px; border-radius: 8px; text-decoration: none; font-weight: bold; font-size: 14px; display: block; }
        .buy-btn:hover { background: #4752c4; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div>
                <h1>🤖 디스코드 봇 & 소스코드 마켓</h1>
                <p>안전하고 빠른 디스코드 봇 분양</p>
            </div>
            <button id="adminBtn" onclick="toggleAdmin()">관리자 로그인</button>
        </header>

        <div id="adminPanel" class="admin-panel">
            <h3 style="margin: 0 0 15px 0; color: #60a5fa;">🛠️ [관리자] 새로운 봇 등록하기</h3>
            <input type="text" id="botTitle" placeholder="봇 이름 (예: 게임 전용 봇)">
            <input type="text" id="botPrice" placeholder="가격 (예: 8,000원)">
            <textarea id="botDesc" placeholder="봇 설명" style="height: 80px;"></textarea>
            <button onclick="addBot()" style="background: #3b82f6; border: none;">스토어에 등록하기</button>
        </div>

        <h2>📦 판매 중인 봇 목록</h2>
        <div id="botGrid" class="grid">
            <!-- 봇 목록이 여기에 동적으로 들어갑니다 -->
        </div>
    </div>

    <script>
        let isAdmin = false;
        let bots = [
            { id: 1, title: '⚡ 디스코드 셀프봇 (소스코드 지원)', price: '35,000원', desc: '다양한 명령어와 유틸리티를 지원하는 고성능 셀프봇 소스코드 패키지.' },
            { id: 2, title: '💥 디스코드 서버테러봇 (소스코드 지원)', price: '20,000원', desc: '서버테러 및 레이드 제어 기능, 채널/역할 일괄 생성/삭제 시스템.' }
        ];

        function renderBots() {
            const grid = document.getElementById('botGrid');
            grid.innerHTML = '';
            bots.forEach(bot => {
                grid.innerHTML += `
                    <div class="card">
                        <div>
                            <h3>${bot.title}</h3>
                            <p>${bot.desc}</p>
                            <div class="price">${bot.price}</div>
                        </div>
                        <a href="https://discord.com/users/1531164394874994813" target="_blank" class="buy-btn">💬 구매 및 문의하기</a>
                    </div>
                `;
            });
        }

        function toggleAdmin() {
            if (!isAdmin) {
                const pw = prompt("관리자 비밀번호를 입력하세요 (기본: 1111):");
                if (pw === "1203") {
                    isAdmin = true;
                    document.getElementById('adminPanel').style.display = 'block';
                    document.getElementById('adminBtn').innerText = "👑 관리자 작동중";
                    document.getElementById('adminBtn').style.background = "#10b981";
                    alert("👑 관리자 모드가 활성화되었습니다!");
                } else {
                    alert("❌ 비밀번호가 틀렸습니다.");
                }
            } else {
                isAdmin = false;
                document.getElementById('adminPanel').style.display = 'none';
                document.getElementById('adminBtn').innerText = "관리자 로그인";
                document.getElementById('adminBtn').style.background = "#1e293b";
            }
        }

        function addBot() {
            const title = document.getElementById('botTitle').value;
            const price = document.getElementById('botPrice').value;
            const desc = document.getElementById('botDesc').value;

            if(!title || !price || !desc) {
                alert("모든 칸을 채워주세요!");
                return;
            }

            bots.unshift({ id: Date.now(), title, price, desc });
            renderBots();
            document.getElementById('botTitle').value = '';
            document.getElementById('botPrice').value = '';
            document.getElementById('botDesc').value = '';
            alert("성공적으로 등록되었습니다!");
        }

        renderBots();
    </script>
</body>
</html>
